   <g id="text_1">
    <text style="fill: #f7f3ed; font: 700 28px 'DejaVu Sans'; text-anchor: start" x="39.6" y="51.515625" transform="rotate(-0 39.6 51.515625)">Large-fire review policy</text>
   </g>
   <g id="text_2">
    <text style="fill: #ffc36a; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="41.04" y="84.277031" transform="rotate(-0 41.04 84.277031)">Thresholds fixed on earlier seasons, tested on later ones</text>
   </g>
   <g id="text_3">
    <text style="fill: #87d7cb; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="53.28" y="142.589625" transform="rotate(-0 53.28 142.589625)">Training and model selection</text>
   </g>
   <g id="text_4">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="167.726125" transform="rotate(-0 53.28 167.726125)">2000–2019 · 132,037 records · 4.9% large</text>
   </g>
   <g id="text_5">
    <text style="fill: #87d7cb; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="438.48" y="142.589625" transform="rotate(-0 438.48 142.589625)">Threshold setting</text>
   </g>
   <g id="text_6">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="438.48" y="167.726125" transform="rotate(-0 438.48 167.726125)">2020–2022 · 16,296 records · 6.7% large</text>
   </g>
   <g id="text_7">
    <text style="fill: #87d7cb; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="866.88" y="142.589625" transform="rotate(-0 866.88 142.589625)">Held-out test</text>
   </g>
   <g id="text_8">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="866.88" y="167.726125" transform="rotate(-0 866.88 167.726125)">2023–2025 · 18,814 records · 10.8% large</text>
   </g>
   <g id="text_9">
    <text style="fill: #ffc36a; font: 700 10.8px 'DejaVu Sans'; text-anchor: end" x="851.76" y="101.086312" transform="rotate(-0 851.76 101.086312)">Freeze model and thresholds</text>
   </g>
   <g id="text_10">
    <text style="fill: #87d7cb; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="53.28" y="252.749625" transform="rotate(-0 53.28 252.749625)">Inputs and model comparison</text>
   </g>
   <g id="text_11">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="277.886125" transform="rotate(-0 53.28 277.886125)">Report month, reporting agency, latitude and longitude. Fit preprocessing inside each fold.</text>
   </g>
   <g id="text_12">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="301.166125" transform="rotate(-0 53.28 301.166125)">Forward average precision over 5 folds: logistic regression 0.285, gradient boosting 0.369. Gradient boosting selected.</text>
   </g>
   <g id="text_13">
    <text style="fill: #ffc36a; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="827.28" y="252.749625" transform="rotate(-0 827.28 252.749625)">Cost rule</text>
   </g>
   <g id="text_14">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="827.28" y="277.886125" transform="rotate(-0 827.28 277.886125)">False alerts + multiplier × missed large fires. Thresholds</text>
   </g>
   <g id="text_15">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="827.28" y="293.966125" transform="rotate(-0 827.28 293.966125)">are selected on ranking scores.</text>
   </g>
   <g id="text_16">
    <text style="fill: #ffc36a; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="53.28" y="398.189625" transform="rotate(-0 53.28 398.189625)">Held-out large-fire outcomes</text>
   </g>
   <g id="text_17">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="423.326125" transform="rotate(-0 53.28 423.326125)">10× rule · 5,291 reviews · 1,498 flagged · 529 missed</text>
   </g>
   <g id="text_18">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="446.606125" transform="rotate(-0 53.28 446.606125)">20× rule · 6,566 reviews · 1,634 flagged · 393 missed</text>
   </g>
   <g id="text_19">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="469.886125" transform="rotate(-0 53.28 469.886125)">Under the same 10× formula: 9,083 for 10× and 8,862 for 20×.</text>
   </g>
   <g id="text_20">
    <text style="fill: #ff9b70; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="591.12" y="398.189625" transform="rotate(-0 591.12 398.189625)">10× → 20× on the same records</text>
   </g>
   <g id="text_21">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="591.12" y="423.326125" transform="rotate(-0 591.12 423.326125)">+1,275 reviews and +136 large fires flagged</text>
   </g>
   <g id="text_22">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="591.12" y="446.606125" transform="rotate(-0 591.12 446.606125)">About 9.4 additional reviews per additional large fire flagged.</text>
   </g>
   <g id="text_23">
    <text style="fill: #ffc36a; font: 700 15.2px 'DejaVu Sans'; text-anchor: start" x="53.28" y="556.589625" transform="rotate(-0 53.28 556.589625)">Management question</text>
   </g>
   <g id="text_24">
    <text style="fill: #d6d3ce; font: 12px 'DejaVu Sans'; text-anchor: start" x="53.28" y="581.726125" transform="rotate(-0 53.28 581.726125)">How much additional review capacity is worth one more large fire flagged?</text>
   </g>
   <g id="text_25">
    <text style="fill: #d6d3ce; font: 10.2px 'DejaVu Sans'; text-anchor: start" x="40.32" y="637.750406" transform="rotate(-0 40.32 637.750406)">Retrospective research on archived records. Not a live forecast. Staffing needs and prevented losses were not measured. Multipliers are planning assumptions, not financial estimates.</text>
   </g>
   <g id="text_26">
    <text style="fill: #87d7cb; font: 10.2px 'DejaVu Sans'; text-anchor: start" x="40.32" y="660.070406" transform="rotate(-0 40.32 660.070406)">Not yet tested: an agency-by-month rate baseline, and the model without reporting agency.</text>
   </g>
  </g>
 </g>
